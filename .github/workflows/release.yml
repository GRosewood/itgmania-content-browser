name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lua checks (syntax, blocks, limits, wiring, names)
        run: |
          # luaparse first: without it syntax.js -- the strictest of the
          # checks -- passes with a SKIP instead of parsing anything.
          npm install --prefix tools/lua-checks
          node tools/lua-checks/check.js

  build:
    needs: test
    runs-on: windows-latest   # has Inno Setup available for the GUI installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Cross-compile every target and build the Windows setup
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          case "$version" in v*) version="${version#v}" ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./build.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  macos-pkg:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build the macOS installer package
        run: |
          version="${GITHUB_REF_NAME}"
          case "$version" in v*) version="${version#v}" ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          # only the macOS binaries are needed here; build.sh makes them all
          ./build.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg

  release:
    needs: [build, macos-pkg]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the built artifacts
        run: |
          mkdir -p dist
          # The semicolon is escaped so find receives it as the -exec terminator
          # rather than bash eating it as a command separator. Unescaped, find
          # aborts with "missing argument to -exec", dist stays empty, and the
          # checksum step below runs on nothing.
          find artifacts -type f -exec cp {} dist/ \;

      # The module archive is the one thing whose exact BYTES are promised:
      # update.json carries its sha256 and the browser refuses an archive that
      # does not match. Zip output is not stable across Go versions, so the copy
      # this runner just built differs from the one the maintainer checksummed
      # even though the contents are identical -- which failed the in-game
      # update for every player, three releases running.
      #
      # So the committed archive wins, and a disagreement stops the release
      # here rather than reaching anybody.
      - name: Publish the archive the manifest describes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="dist/itgmania-content-browser-module-${version}.zip"

          if [ ! -f release/module.zip ]; then
            echo "release/module.zip is missing."
            echo "Run ./build.sh, then commit it together with update.json."
            exit 1
          fi
          cp release/module.zip "$zip"

          manifest_version=$(jq -r .version update.json)
          want_sha=$(jq -r .module.sha256 update.json)
          want_bytes=$(jq -r .module.bytes update.json)
          got_sha=$(sha256sum "$zip" | cut -d' ' -f1)
          got_bytes=$(stat -c%s "$zip")

          fail=0
          if [ "$manifest_version" != "$version" ]; then
            echo "update.json says version $manifest_version, the tag says $version"; fail=1
          fi
          if [ "$want_sha" != "$got_sha" ]; then
            echo "update.json sha256   $want_sha"
            echo "release/module.zip   $got_sha"; fail=1
          fi
          if [ "$want_bytes" != "$got_bytes" ]; then
            echo "update.json bytes $want_bytes, archive $got_bytes"; fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo
            echo "The manifest does not describe the archive being published."
            echo "Re-run ./build.sh and commit update.json and release/module.zip together."
            exit 1
          fi
          # the manifest attached to the release is the committed one too, so
          # every file in the release describes the same archive
          cp update.json dist/update.json

          echo "manifest and archive agree: $got_sha ($got_bytes bytes)"

      - name: Checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
